<script>
  // State
  let currentType = 'expense'; // 'expense' | 'income'
  let currentStatus = 'paid'; // 'paid' | 'pending'
  let currentAmount = '145,90';

  const amountInput = document.getElementById('amountInput');
  const saveBtnLabel = document.getElementById('saveBtnLabel');
  const typeExpenseBtn = document.getElementById('typeExpenseBtn');
  const typeIncomeBtn = document.getElementById('typeIncomeBtn');
  const statusPaidBtn = document.getElementById('statusPaidBtn');
  const statusPendingBtn = document.getElementById('statusPendingBtn');
  const recurrenceToggle = document.getElementById('recurrenceToggle');
  const recurrenceOptions = document.getElementById('recurrenceOptions');
  const selectedCategoryLabel = document.getElementById('selectedCategoryLabel');
  const categoryChips = document.querySelectorAll('.cat-chip');

  function updateSaveLabel() {
    saveBtnLabel.textContent = `Salvar Lançamento (R$ ${amountInput.value || '0,00'})`;
  }

  // Currency input formatting & live sync
  amountInput.addEventListener('input', (e) => {
    let val = e.target.value.replace(/\D/g, '');
    if (!val) {
      amountInput.value = '0,00';
    } else {
      let num = (parseInt(val, 10) / 100).toFixed(2);
      amountInput.value = num.replace('.', ',');
    }
    updateSaveLabel();
  });

  function quickAddAmount(increment) {
    let current = parseFloat(amountInput.value.replace(',', '.')) || 0;
    let next = (current + increment).toFixed(2);
    amountInput.value = next.replace('.', ',');
    updateSaveLabel();
  }

  function clearAmount() {
    amountInput.value = '0,00';
    updateSaveLabel();
  }

  // Type Selector Toggle (Despesa / Receita)
  typeExpenseBtn.addEventListener('click', () => {
    currentType = 'expense';
    typeExpenseBtn.className = "flex-1 py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-all duration-200 bg-tertiary-container text-on-tertiary-container shadow-sm";
    typeExpenseBtn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
    typeIncomeBtn.className = "flex-1 py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface";
    typeIncomeBtn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "";
  });

  typeIncomeBtn.addEventListener('click', () => {
    currentType = 'income';
    typeIncomeBtn.className = "flex-1 py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-all duration-200 bg-secondary text-on-secondary shadow-sm";
    typeIncomeBtn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
    typeExpenseBtn.className = "flex-1 py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface";
    typeExpenseBtn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "";
  });

  // Status Selector (Pago vs Pendente)
  statusPaidBtn.addEventListener('click', () => {
    currentStatus = 'paid';
    statusPaidBtn.className = "py-2.5 px-3 rounded-lg flex items-center justify-center gap-2 font-label-md text-label-md bg-secondary text-on-secondary shadow-sm transition-all duration-200";
    statusPendingBtn.className = "py-2.5 px-3 rounded-lg flex items-center justify-center gap-2 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200";
  });

  statusPendingBtn.addEventListener('click', () => {
    currentStatus = 'pending';
    statusPendingBtn.className = "py-2.5 px-3 rounded-lg flex items-center justify-center gap-2 font-label-md text-label-md bg-surface-container-highest text-on-surface shadow-sm transition-all duration-200";
    statusPaidBtn.className = "py-2.5 px-3 rounded-lg flex items-center justify-center gap-2 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200";
  });

  // Category Selector Chips
  categoryChips.forEach(chip => {
    chip.addEventListener('click', () => {
      categoryChips.forEach(c => {
        c.className = "cat-chip flex flex-col items-center justify-center p-2.5 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-all active:scale-95";
        const icon = c.querySelector('.material-symbols-outlined');
        icon.className = "material-symbols-outlined text-[22px] mb-1 text-on-surface-variant";
        icon.style.fontVariationSettings = "";
      });
      chip.className = "cat-chip flex flex-col items-center justify-center p-2.5 rounded-xl bg-primary text-on-primary transition-all active:scale-95";
      const activeIcon = chip.querySelector('.material-symbols-outlined');
      activeIcon.className = "material-symbols-outlined text-[22px] mb-1 text-on-primary";
      activeIcon.style.fontVariationSettings = "'FILL' 1";
      selectedCategoryLabel.textContent = chip.getAttribute('data-cat');
    });
  });

  // Date Preset Helpers
  function setDatePreset(type) {
    const d = new Date();
    if (type === 'ontem') {
      d.setDate(d.getDate() - 1);
    }
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();
    document.getElementById('dateInput').value = `${day}/${month}/${year}`;
  }

  // Recurrence Accordion Toggle
  recurrenceToggle.addEventListener('change', (e) => {
    if (e.target.checked) {
      recurrenceOptions.classList.remove('hidden');
    } else {
      recurrenceOptions.classList.add('hidden');
    }
  });

  // Save Trigger Simulation with Toast
  function triggerSaveFeedback() {
    const toast = document.getElementById('toastNotification');
    const toastMsg = document.getElementById('toastMessage');
    toastMsg.textContent = `Lançamento de R$ ${amountInput.value} salvo!`;
    
    toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
    toast.classList.add('opacity-100', 'translate-y-0');
    
    setTimeout(() => {
      toast.classList.remove('opacity-100', 'translate-y-0');
      toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
    }, 2400);
  }

  document.getElementById('saveTransactionBtn').addEventListener('click', triggerSaveFeedback);
  document.getElementById('quickSaveTopBtn').addEventListener('click', triggerSaveFeedback);
</script></main></body></html>
