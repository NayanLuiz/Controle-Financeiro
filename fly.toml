# Fly.io configuration for Personal Finance MVP (single-instance SQLite WAL)
# First-time setup:
#   1. fly launch --no-deploy
#   2. fly volumes create finance_data --region gru --size 1
#   3. fly secrets set APP_PASSWORD="..." SESSION_SECRET="$(openssl rand -hex 32)"
#   4. fly deploy --ha=false

app = "personal-finance-mvp"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_PATH = "/data/finance.db"

[[mounts]]
  source = "finance_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
