services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-finance:latest
    container_name: personal-finance-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_PATH: /data/finance.db
      APP_PASSWORD: ${APP_PASSWORD:-change-me-strong-password}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-32-chars-minimum-secret-key}
    volumes:
      - finance_data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  finance_data:
    name: personal_finance_data
